name: zfs-wasm-pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zfs-wasm-demo-pages.yml"
      - ".nojekyll"
      - "index.html"
      - "README.md"
      - "zfs-wasm/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zfs-wasm-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          rm -rf _site
          mkdir -p _site/zfs-wasm
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R zfs-wasm/. _site/zfs-wasm/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
