name: real-zfs-pages

# Build the OpenZFS-wasm module inside the zfs-wasm-real Docker image
# and publish the demo under /real-zfs/ on GitHub Pages. The zfs-wasm/
# (Rust toy) Pages workflow is kept separate — they publish to
# different paths and do not interfere.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/real-zfs-pages.yml"
      - "real-zfs/**"
      - "zfs-wasm-real/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: real-zfs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zfs-wasm-real Docker image
        working-directory: zfs-wasm-real
        run: ./scripts/docker-build-image.sh

      - name: Fetch upstream OpenZFS and apply patches
        working-directory: zfs-wasm-real
        run: |
          ./scripts/docker-run.sh "./scripts/fetch-upstream.sh && bash scripts/apply-patches.sh"

      - name: Build zfswasm module
        working-directory: zfs-wasm-real
        run: ./scripts/docker-run.sh "make zfswasm"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          rm -rf _site
          mkdir -p _site/real-zfs/build
          cp real-zfs/index.html _site/real-zfs/index.html
          cp real-zfs/styles.css _site/real-zfs/styles.css
          cp real-zfs/app.js _site/real-zfs/app.js
          cp real-zfs/sw.js _site/real-zfs/sw.js
          cp zfs-wasm-real/build/zfswasm.js       _site/real-zfs/build/zfswasm.js
          cp zfs-wasm-real/build/zfswasm.wasm     _site/real-zfs/build/zfswasm.wasm
          if [ -f zfs-wasm-real/build/zfswasm.worker.js ]; then
            cp zfs-wasm-real/build/zfswasm.worker.js _site/real-zfs/build/zfswasm.worker.js
          fi
          # Landing page at /real-zfs/ redirects in case anyone hits the root.
          printf '<meta http-equiv="refresh" content="0;url=./real-zfs/">' > _site/index.html
          : > _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
