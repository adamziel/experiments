<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experiments</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7f1e8 0%, #e9decb 100%);
        color: #241913;
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 251, 244, 0.9);
        box-shadow: 0 24px 64px rgba(64, 40, 20, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 0.95;
      }

      p {
        line-height: 1.6;
      }

      a {
        color: #0f766e;
      }

      ul {
        padding-left: 1.2rem;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Experiments</h1>
      <p>Small, self-contained engineering experiments.</p>
      <ul>
        <li><a href="./zfs-wasm/">zfs-wasm</a>: WebAssembly snapshot filesystem demo with branching and snapshots.</li>
      </ul>
      <p><a href="https://github.com/adamziel/experiments">Repository</a></p>
    </main>
  </body>
</html>
